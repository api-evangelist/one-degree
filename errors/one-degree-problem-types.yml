problems:
- status: 400
  title: Bad Request
  description: Something was wrong with the request, commonly a missing API key.
  example_message: Missing API key.
- status: 401
  title: Unauthorized
  description: The request could not be authorized, commonly an invalid API key or request signature.
- status: 403
