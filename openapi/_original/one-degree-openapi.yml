openapi: 3.0.3
info:
  title: One Degree Resource Server API
  description: The One Degree Resource Server API provides read access to a curated database of social-service
    community resources — organizations and the opportunities (programs/services) they offer, along with
    locations, phones, schedules, ratings, tags, comments, images, properties, guides, and housing properties.
    One Degree is a California 501(c)(3) nonprofit; the API supports interoperability with third-party
    services to improve coordination and delivery of social services. Data is licensed CC BY-NC 4.0. All
    requests require an api_key query parameter; write verbs (POST/PUT/DELETE) additionally require HMAC-SHA256
    request signatures via the 1deg-Date and 1deg-Signature headers.
  version: 1.0.0
  contact:
    name: One Degree
    url: https://about.1degree.org/contact-us/
  license:
    name: CC BY-NC 4.0
    url: https://creativecommons.org/licenses/by-nc/4.0/
  x-api-evangelist-derived-from: https://github.com/1deg/resource-server-api-docs (Postman collection
    + docs)
