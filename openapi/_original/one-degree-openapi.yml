components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: query
      name: api_key
      description: All requests require an api_key query parameter. Request a key at http://socialservicedata.org/api/get-key/
  parameters:
    page:
      name: page
      in: query
      required: false
      description: The page offset. Default is 1.
      schema:
        type: integer
      example: 3
    per_page:
      name: per_page
      in: query
      required: false
      description: Number of items to return. Default is 10.
      schema:
        type: integer
      example: 10
    titles_only:
      name: titles_only
      in: query
      required: false
      description: Return only titles/basic info instead of full resource objects.
      schema:
        type: boolean
      example: true
    ids:
      name: ids
      in: query
      required: false
      description: Comma-separated set of IDs whose records will be returned.
      schema:
        type: string
      example: 3,49,2
    query_text:
      name: query[text]
      in: query
      required: false
      description: Full-text search keywords. Surround in quotes for exact phrase.
      schema:
        type: string
      example: health clinic
    query_tags:
      name: query[tags]
      in: query
      required: false
      description: Classification tags associated with opportunities.
      schema:
        type: string
      example: Childcare
    query_lat:
      name: query[lat]
      in: query
      required: false
      description: Latitude around which to search.
      schema:
        type: number
      example: 37.7823
    query_long:
      name: query[long]
      in: query
      required: false
      description: Longitude around which to search.
      schema:
        type: number
      example: -122.46
    query_distance:
      name: query[distance]
      in: query
      required: false
      description: Radius in kilometers around the coordinates to search within.
      schema:
        type: number
      example: 40.2336
    query_order:
      name: query[order]
      in: query
      required: false
      description: Ordering of results (default scored by best match, distance and other factors).
      schema:
        type: string
    query_match:
      name: query[match]
      in: query
      required: false
      description: 'Match logic: any, properties, or by_type.'
      schema:
        type: string
      example: by_type
  responses:
    BadRequest:
      description: Bad Request — something was wrong with the request, often a missing API key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: error
            error: Missing API key.
    Unauthorized:
      description: Unauthorized — invalid API key or request signature.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: error
            error: Invalid API key or signature.
    Forbidden:
      description: Forbidden — the client is not allowed to perform the requested action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: error
            error: Forbidden.
    NotFound:
      description: Not Found — nothing at the requested endpoint.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: error
            error: Not found.
    ServerError:
      description: Internal Server Error — a problem occurred at the server.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: error
            error: Internal server error.
  schemas:
    Error:
      type: object
      properties:
        status:
          type: string
          example: error
        error:
          type: string
          example: Missing API key.
