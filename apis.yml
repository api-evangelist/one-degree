name: One Degree
description: >-
  One Degree is a California-based 501(c)(3) nonprofit technology organization that empowers
  low-income and underserved individuals, families, and social-service professionals to find and
  access life-changing benefits and services. Its Resource Server API exposes a curated, community-
  maintained database of social-service resources — organizations and the opportunities (programs
  and services) they offer, along with locations, phones, schedules, ratings, tags, comments,
  images, properties, guides, and housing properties. The API is designed for interoperability with
  third-party services so communities can coordinate and deliver social services more effectively.
  It is a read-focused REST API served at data.1degree.org/v1, authenticated with an api_key query
  parameter and HMAC-SHA256 request signatures for write verbs. Resource data is licensed under
  Creative Commons Attribution-NonCommercial 4.0 International.
